services:
  bot:
    image: ghcr.io/reali-705/promomonitor:latest
    container_name: promomonitor
    restart: unless-stopped
    environment:
      - TZ=America/Belem
    env_file:
      - .env
    volumes:
      - ./promomonitor.session:/app/promomonitor.session
      - ./keywords.json:/app/keywords.json
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
networks: {}